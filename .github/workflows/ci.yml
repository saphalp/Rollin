name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        # The *-db.cjs tests need @electric-sql/pglite, which isn't a dependency, so they're run locally only.
        run: node --test $(ls scripts/test-*.cjs | grep -v -- '-db\.cjs$' | grep -v 'test-ride-database\.cjs$')

      - name: Verify the app bundles (catches Metro/syntax errors)
        run: npx expo export --platform android
