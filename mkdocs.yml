site_name: Rollin Documentation
site_description: Developer documentation for the Rollin mobile application

repo_name: saphalp/Rollin
repo_url: https://github.com/saphalp/Rollin

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Features:
      - Authentication: features/authentication.md
      - Password Reset: features/password-reset.md
      - User Profiles and Connections: features/user-profiles-and-connections.md
      - Activity Creation and Discovery: features/activity-creation-and-discovery.md
      - Messaging and Notifications: features/messaging-and-notifications.md
      - Ride Sharing: features/ride-sharing.md
      - Live Ride Tracking: features/live-ride-tracking.md

markdown_extensions:
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css