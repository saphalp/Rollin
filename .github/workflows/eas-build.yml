name: EAS Build and Submit (Android)

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # also allow manual runs from the Actions tab

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit to Play Store (internal track)
        run: eas build --platform android --profile production --non-interactive --auto-submit
