name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --test scripts/test-rating-reminder.cjs scripts/test-ride-navigation.cjs scripts/test-ride-notifications.cjs scripts/test-ride-route.cjs scripts/test-ride-tracking.cjs scripts/test-router-initial-link.cjs scripts/test-signup-verification.cjs scripts/test-tutorial.cjs scripts/test-validate-driver-fields.cjs scripts/test-didit-webhook.cjs

      - name: Verify the app bundles (catches Metro/syntax errors)
        run: npx expo export --platform android
